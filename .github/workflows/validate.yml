name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static gate (shared with release)
        run: bash scripts/check-static.sh

      - name: Shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck docker/*.sh scripts/*.sh

      - name: Hadolint
        # The official action (rather than the container image, which exposes no
        # entrypoint and therefore ignored .hadolint.yaml when fed via stdin).
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Resolve current stable components
        id: components
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/resolve-component-versions.mjs --dsh=0.0.0 --node=24.21.0 \
            --repository="${GITHUB_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Caddy configuration
        run: |
          set -euo pipefail
          for config in edge lan; do
            docker run --rm \
              --volume "${PWD}/docker:/etc/caddy:ro" \
              --env PORT=8080 \
              --env DSH_INTERNAL_PORT=3080 \
              --env PUBLIC_ORIGIN=https://validate.example \
              --env DSH_UPSTREAM_HOST=validate.example \
              --env DSH_LAUNCH_TOKEN=validate \
              --entrypoint caddy \
              caddy:${{ steps.components.outputs.caddy }} validate --config "/etc/caddy/Caddyfile.${config}" --adapter caddyfile
            printf 'caddy validate ok: Caddyfile.%s\n' "${config}"
          done

      - name: Proxy response compression
        run: |
          set -euo pipefail
          # Reuse the resolved Caddy binary; the fixture only needs Node's standard library.
          docker run --rm --entrypoint sh caddy:${{ steps.components.outputs.caddy }} \
            -c 'cat "$(command -v caddy)"' > "${RUNNER_TEMP}/dsh-caddy"
          chmod +x "${RUNNER_TEMP}/dsh-caddy"
          CADDY_BIN="${RUNNER_TEMP}/dsh-caddy" node scripts/test-proxy-compression.mjs

      - name: Scripts run end to end
        run: |
          set -euo pipefail
          node scripts/resolve-dsh-version.mjs --json
          # The dependency pruner must stay a no-op on a tree with nothing to prune,
          # and must never fail the build when it is given nothing to work with.
          node scripts/prune-node-modules.mjs --root="$(mktemp -d)"
          bash -n scripts/smoke.sh
          printf 'scripts ok\n'
